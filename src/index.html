<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tunepeek</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="flyout">
<div class="card" id="card">
  <div class="row1">
    <img id="art" alt="">
    <div class="meta">
      <div class="t1" id="title">Nothing playing</div>
      <div class="t2" id="artist"></div>
      <div class="ctrl">
        <button class="ic" id="prev" title="Previous"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
        <button class="ic main" id="pp" title="Play / pause">
          <svg id="icPlay" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          <svg id="icPause" class="hidden" viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
        </button>
        <button class="ic" id="next" title="Next"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5l11 7-11 7z"/></svg></button>
        <div class="vol" title="Volume (scroll anywhere on the card)">
          <svg viewBox="0 0 24 24"><path id="volIcon" d="M3 9v6h4l5 5V4L7 9zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4z"/></svg>
          <input type="range" id="vol" min="0" max="100" value="50">
        </div>
      </div>
    </div>
  </div>
  <div class="prog"><span id="t0">0:00</span><input type="range" id="seek" min="0" max="1" value="0"><span id="t1">0:00</span></div>
  <div class="lyric hidden" id="lyric"></div>
</div>
<script src="flyout.js"></script>
</body>
</html>
